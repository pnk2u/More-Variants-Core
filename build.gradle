plugins {
	id 'fabric-loom' // version from versions.gradle via settings.gradle's pluginManagement
	id 'maven-publish'
}

apply from: "versions.gradle"

def mc_version_name(){
	def named = project.findProperty('minecraft_version_name')
	return named ? named : project.minecraft_version
}

version = "${mod_version}+${mc_version_name()}-Fabric"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
	maven {
		name = 'Modrinth'
		url = "https://api.modrinth.com/maven"
	}
	maven { url = "https://maven.bawnorton.com/releases" }
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven { url "https://maven.shedaniel.me/" }
	maven {
		name = 'SomethingSketchy' // EveryCompat, Moonlight
		url = "https://registry.somethingcatchy.net/repository/maven-releases/"
	}
	mavenLocal()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		project.properties.get("mod_id") {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	log4jConfigs.from(file("log4j.xml"))
}

fabricApi {
	//configureDataGeneration()
}

def releaseVersion = getReleaseVersion(minecraft_version)
def (fabric_loader_version, fabric_loader_version_0, fabric_api_version) = latestFabric(releaseVersion)
def (pMinecraftVersion, mostRecentParchmentDate) = latestParchment(releaseVersion)

dependencies {
	implementation 'org.apache.commons:commons-text:1.12.0'
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${pMinecraftVersion}:${mostRecentParchmentDate}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

				// More Variants: Pale Oak Backport
					//modRuntimeOnly("de.pnku:MoreVariantsPaleOakBackport:${m_v_pale_oak_backport_version_id}+1.21(.1)-Fabric")
		// Vanilla Backport
		modLocalRuntime("maven.modrinth:vanillabackport:${vanillabackport_version_id}")
		modLocalRuntime("maven.modrinth:platform:${platform_version_id}")
		include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7-beta.1")))

	// More Variants
		// Quad
		modCompileOnly modLocalRuntime("maven.modrinth:quad:${quad_version_id}")
		// More Barrel Variants
		modCompileOnly modLocalRuntime("maven.modrinth:more-barrel-variants:${m_barrel_v_version_id}")
		// More Bed Variants
		modCompileOnly modLocalRuntime("maven.modrinth:more-bed-variants:${m_bed_v_version_id}")
		// More Beehive Variants
		modCompileOnly modLocalRuntime("maven.modrinth:more-beehive-variants:${m_beehive_v_version_id}")
		// More Bookshelf Variants (LieOnLion)
		modCompileOnly modLocalRuntime("maven.modrinth:more-bookshelf-variants-lieonlion:${m_bookshelf_v_lol_version_id}")
		// More Cartography Tables
		modCompileOnly modLocalRuntime("maven.modrinth:more-cartography-tables:${m_cartography_t_version_id}")
		// More Chiseled Bookshelf Variants
		modCompileOnly modLocalRuntime("maven.modrinth:more-chiseled-bookshelf-variants:${m_chiseled_bookshelf_v_version_id}")
		// More Chest Variants (LieOnLion)
		modCompileOnly modLocalRuntime("maven.modrinth:more-chest-variants-lieonlion:${m_chest_v_lol_version_id}")
		// More Composter Variants
		modCompileOnly modLocalRuntime("maven.modrinth:more-composter-variants:${m_composter_v_version_id}")
			// More Feeding Trough Variants
			modCompileOnly modLocalRuntime("maven.modrinth:more-feeding-trough-variants:${m_feeding_trough_v_version_id}")
				// Dependency: Animal Feeding Trough
				modCompileOnly modLocalRuntime("maven.modrinth:animal_feeding_trough:${animal__feeding__trough_version_id}")
					// Dependency: Architectury API
					modApi "dev.architectury:architectury-fabric:${architectury_api_version}"
		// More Crafter Variants
		modCompileOnly modLocalRuntime("maven.modrinth:more-crafter-variants:${m_crafter_v_version_id}")
		// More Crafting Tables (LieOnLion)
		modCompileOnly modLocalRuntime("maven.modrinth:more-crafting-tables-lieonlion:${m_crafting_t_lol_version_id}")
		// More Fletching Tables
		modCompileOnly modLocalRuntime("maven.modrinth:more-fletching-tables:${m_fletching_t_version_id}")
		// More Grindstone Variants
		modCompileOnly modLocalRuntime("maven.modrinth:more-grindstone-variants:${m_grindstone_v_version_id}")
		// More Jukebox/Noteblock Variants
		modCompileOnly modLocalRuntime("maven.modrinth:more-jukebox-noteblock-variants:${m_jukebox_noteblock_v_version_id}")
		// More Lectern Variants
		modCompileOnly modLocalRuntime("maven.modrinth:more-lectern-variants:${m_lectern_v_version_id}")
		// More Loom Variants
		modCompileOnly modLocalRuntime("maven.modrinth:more-loom-variants:${m_loom_v_version_id}")
		// More Nemo's Woodcutter Variants
		modCompileOnly modLocalRuntime("maven.modrinth:more-nemos-woodcutter-variants:${m_nemos_woodcutter_v_version_id}")
			// Dependency: Nemo's Woodcutter
			modCompileOnly modLocalRuntime("maven.modrinth:nemos-woodcutter:${nemos_woodcutter_version_id}")
		// More Shield Variants
		modCompileOnly modLocalRuntime("maven.modrinth:more-shield-variants:${m_shield_v_version_id}")
			// Dependencies: Cloth Config, Mod Menu
			modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}")
			modApi("com.terraformersmc:modmenu:${modmenu_version}")
		// More Smithing Tables
		modCompileOnly modLocalRuntime("maven.modrinth:more-smithing-tables:${m_smithing_t_version_id}")
		// More Smoker Variants
		modCompileOnly modLocalRuntime("maven.modrinth:more-smoker-variants:${m_smoker_v_version_id}")
			// Optional Dependency: More Furnace Variants
			modLocalRuntime("maven.modrinth:more-furnace-variants-lieonlion:${m_furnace_v_lol_version_id}")
		// MStV
			// More Stick Variants
			modCompileOnly modLocalRuntime("maven.modrinth:more-stick-variants:${mstv_version_id}")
			// More Armor Stand Variants
			modCompileOnly modLocalRuntime("maven.modrinth:more-armor-stand-variants:${mstv_m_armor_stand_v_version_id}")
			// More Frame Variants
			modCompileOnly modLocalRuntime("maven.modrinth:more-frame-variants:${mstv_m_frame_v_version_id}")
				// Fast Item Frames
				modCompileOnly modLocalRuntime("maven.modrinth:fast-item-frames:${fast_item_frames_version_id}")
					// Dependencies: Puzzles Lib, Forge Config API Port
					modCompileOnly 	modLocalRuntime("maven.modrinth:puzzles-lib:${puzzles_lib_version_id}")
									modLocalRuntime("maven.modrinth:forge-config-api-port:${forge_config_api_port_version_id}")
									implementation 'com.electronwill.night-config:core:3.8.2'
									implementation 'com.electronwill.night-config:toml:3.8.2'
			// Nemo's More Ladder Variants
			modCompileOnly modLocalRuntime("maven.modrinth:nemos-more-ladder-variants:${mstv_nemos_m_ladder_v_version_id}")
			// More Rail Variants
			modCompileOnly modLocalRuntime("maven.modrinth:more-rail-variants:${mstv_m_rail_v_version_id}")
			// More (Fishing) Rod Variants
			modCompileOnly modLocalRuntime("maven.modrinth:more-fishing-rod-variants:${mstv_m_fishing_rod_v_version_id}")
			// More Tool Variants
			modCompileOnly modLocalRuntime("maven.modrinth:more-tool-variants:${mstv_m_tool_v_version_id}")
			// More Torch Variants
			modCompileOnly modLocalRuntime("maven.modrinth:more-torch-variants:${mstv_m_torch_v_version_id}")
			// More Weapon Variants
			modCompileOnly modLocalRuntime("maven.modrinth:more-weapon-variants:${mstv_m_weapon_v_version_id}")
		// Nemo
			// Campfires
			modCompileOnly modLocalRuntime("maven.modrinth:nemos-campfires:${nemos_campfires_version_id}")

	// Every Compat
		// Moonlight
		modCompileOnly modLocalRuntime("net.mehvahdjukaar:moonlight-fabric:${moonlight_version}") { transitive = false }
		// Every Compat
		modCompileOnly modLocalRuntime("net.mehvahdjukaar:everycomp-fabric:${every_compat_version}:fabric") { transitive = false }
			// Above for docs, if needed - below in case above's maven is down
			//modCompileOnly("maven.modrinth:moonlight:${moonlight_version}-fabric")
			//modCompileOnly("maven.modrinth:every-compat:${every_compat_version}-fabric")
		// Testing
		modRuntimeOnly("maven.modrinth:wilder-wild:${wilder_wild_version}")
		modRuntimeOnly("maven.modrinth:frozenlib:${frozenlib_version}")


}

def minecraft_version_0 = lowerMinecraftVersion(minecraft_version_lower)
def minecraft_version_1 = upperMinecraftVersion(minecraft_version_upper)
def (java_version, java_version_enum) = javaVersions(releaseVersion)

def replaceProperties = [
		mod_id: mod_id, mod_name: mod_name, mod_description: mod_description, mod_license: mod_license,
		mod_version: mod_version, mstv_version: mstv_version,
		min_floader_version: fabric_loader_version_0,
		minecraft_version_0: minecraft_version_0, minecraft_version_1: minecraft_version_1, java_version: java_version
]
println "===\nExpanding the following values into fabric.mod.json and *.mixins.json:\n${replaceProperties.collect { k, v -> "  ${k}: ${v}" }.join('\n')}\n==="

["processResources", "processClientResources"].each { taskName ->
	tasks.named(taskName) {
		inputs.properties replaceProperties
		["fabric.mod.json", "*.mixins.json"].each { pattern ->
			filesMatching(pattern) {
				expand replaceProperties
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = java_version
}

java {
	sourceCompatibility = java_version_enum
	targetCompatibility = java_version_enum
}

jar {
	from("LICENSE") {
		rename { "${base.archivesName.get()}_${it}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}